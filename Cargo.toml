# Root package: the `vectordata` umbrella binary, so the whole toolkit is
# installable with one `cargo install --path .` at the project root. Its
# default personality IS the vectordata crate's CLI (cache admin,
# datasets, explore) — a strict superset of the standalone bin, safe to
# install over it — plus the veks / vecd / slab personalities dispatched
# by first argument or argv0 symlink. Each personality's shell lives in
# its own crate's `shell` module and the member binaries remain the
# canonical standalone installs (`cargo install --path veks`, …).
#
# NOTE: this package's bin and the vectordata crate's bin intentionally
# share the name `vectordata` (superset relationship). They are never in
# the same default build (see default-members); building both explicitly
# in one invocation (`cargo build --workspace` with the cli feature)
# collides on the output filename — build one or the other with -p.
[package]
name = "vectordata-rs"
version = "1.9.0"
edition = "2024"
description = "Umbrella binary for the vectordata-rs toolkit: the vectordata CLI plus veks, vecd, and slab in one installable multiplexer"
license = "Apache-2.0"
homepage = "https://github.com/nosqlbench/vectordata-rs"
repository = "https://github.com/nosqlbench/vectordata-rs"

# `vectordata-rs` names the *project*, not a crate anyone installs from
# a registry. The publishable artifacts are its members — `vectordata`,
# `veks`, `vecd`, `slabtastic` and the `veks-*` libraries. This package
# exists to build one local multiplexer binary over them:
#
#   cargo install --path .
#
# Marking it unpublishable is also what unblocks releases. `cargo
# publish` run at a workspace root selects `default-members`, never the
# root package — so it was picking up `tools` (itself `publish = false`)
# and failing with "`tools` cannot be published", which cargo-workspaces
# reported as "unable to publish package vectordata-rs". Every release
# ended that way; the crate has never existed on crates.io.
publish = false

[[bin]]
name = "vectordata"
path = "src/main.rs"

[dependencies]
slabtastic = { path = "slabtastic", version = "1.0.0" }
vecd = { path = "vecd", version = "1.0.0" }
vectordata = { path = "vectordata", version = "1.0.0", features = ["cli"] }
veks = { path = "veks", version = "1.0.0", default-features = false }

# Mirror veks's feature surface so `cargo install --path .` gets the same
# default personality as `cargo install --path veks` (knnutils is veks's
# default because bootstrap emits `compute knn-blas`).
[features]
default = ["knnutils"]
knnutils = ["veks/knnutils"]
faiss = ["veks/faiss"]
embed = ["veks/embed"]
embed-cuda = ["veks/embed-cuda"]

[lints]
workspace = true

[workspace]
members = [
    "vectordata",
    "veks-anode",
    "veks-core",
    "veks-pipeline",
    "veks-completion",
    "veks-completion-derive",
    "veks",
    "vecd",
    "slabtastic",
    "veks-io",
    "tools",
    "veks-studies",
]
# Preserve the virtual-workspace default: bare `cargo build`/`cargo test`
# at the root covers the shipping members — and NOT the root package,
# whose `vectordata` bin would collide with the vectordata crate's bin of
# the same name in a combined build. Build the umbrella explicitly with
# `-p vectordata-rs` or `cargo install --path .`.
#
# `veks-studies` is deliberately absent. It is an as-needed analysis
# crate, not something the product ships or that a routine build should
# pay for: its suite runs discrete-event simulations and takes ~200 s,
# which was two thirds of a full workspace test run. Reach for it
# explicitly:
#
#   cargo test -p veks-studies --release --features heavy-tests
#   cargo run  -p veks-studies --release --bin veks-study -- study all
#
# `--workspace` overrides this list, so it would still pull the crate
# in. Its test modules are therefore also gated behind the crate's
# off-by-default `heavy-tests` feature, which makes the exclusion hold
# however the build is invoked.
default-members = [
    "vectordata",
    "veks-anode",
    "veks-core",
    "veks-pipeline",
    "veks-completion",
    "veks-completion-derive",
    "veks",
    "vecd",
    "slabtastic",
    "veks-io",
    "tools",
]
resolver = "3"

# cargo-workspaces (`cargo ws version` / `cargo ws publish`) release config.
#
#   allow_branch = "main"
#     We release from `main`; cargo-workspaces defaults to `master` and
#     would otherwise refuse (or need `--allow-branch main` every time).
#
#   no_individual_tags = true
#     Create ONLY the global `v<version>` tag, not a `<crate>@<version>`
#     tag per changed crate. This is load-bearing for releases: GitHub
#     fires NO push events when more than three tags are pushed at once,
#     and a multi-crate bump pushed 4–6 tags together — silently
#     swallowing the `v<version>` push so the release workflow never ran
#     (v1.6.0 and v1.6.1 shipped no GitHub Release for this reason). One
#     tag per push stays under the limit, so the `v*` push reliably
#     triggers `.github/workflows/build.yml`. (That workflow also keeps a
#     `workflow_dispatch` fallback for re-publishing any tag by hand.)
[workspace.metadata.workspaces]
allow_branch = "main"
no_individual_tags = true

# Workspace lint policy. Member crates opt in via `[lints] workspace = true`.
[workspace.lints.clippy]
# This codebase is dense with SIMD/BLAS-style numeric kernels that
# index several parallel arrays by one loop ordinal (query x segment x
# accumulator). Rewriting those as zipped iterators obscures the
# kernel structure without changing codegen, so the lint is policy-
# allowed; prefer iterators in new non-kernel code regardless.
needless_range_loop = "allow"

[profile.bench]
debug = true

# Release with full DWARF debug info for `perf record --call-graph=dwarf`
# and source-level annotation in `perf report`. Frame pointers kept so
# call-graph fp also works. Inherits everything else from `release`.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
split-debuginfo = "off"
