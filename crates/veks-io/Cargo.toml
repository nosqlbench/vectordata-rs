[package]
name = "veks-io"
version = "4.0.2"
edition = "2024"
description = "Standalone vector data I/O — read and write fvec, ivec, mvec, dvec, bvec, svec, npy, parquet, and slab formats"
license = "Apache-2.0"
homepage = "https://github.com/nosqlbench/vectordata-rs"
repository = "https://github.com/nosqlbench/vectordata-rs"
keywords = ["vector", "fvec", "ivec", "ann", "embeddings"]
categories = ["filesystem", "science", "encoding"]

[features]
default = []
npy = ["dep:ndarray", "dep:ndarray-npy"]
parquet = ["dep:arrow", "dep:parquet"]
slab = ["dep:slabtastic"]

[dependencies]
byteorder = "1"
half = "2"
libc = "0.2"
log = "0.4"
memmap2 = "0.9"
thiserror = "2.0.18"
# The element model: which types a file may hold, what its extension
# says, and what a reader may do when asked for another type. Shared
# with vectordata so the two agree by construction.
veks-datatypes = { path = "../veks-datatypes", version = "=4.0.2" }
# The contracts veks-io implements: ByteSource, the reader and streaming
# traits and the reader error (srd-crate-boundaries.md §4).
veks-apicore = { path = "../veks-apicore", version = "=4.0.2" }

# Optional: npy format support
ndarray = { version = "0.16", optional = true }
ndarray-npy = { version = "0.9", optional = true }

# Optional: parquet format support
arrow = { version = "54", optional = true }
parquet = { version = "54", optional = true }

# Optional: slab format support
slabtastic = { path = "../slabtastic", version = "=4.0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
