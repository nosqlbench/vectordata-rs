[package]
name = "veks-apicore"
version = "4.0.2"
edition = "2024"
description = "The vectordata API: the dataset, catalog, reader, source, streaming and progress contracts, and every descriptor, value and error type they name. Implemented by vectordata, veks-io and veks-transport"
license = "Apache-2.0"
homepage = "https://github.com/nosqlbench/vectordata-rs"
repository = "https://github.com/nosqlbench/vectordata-rs"
keywords = ["vector", "dataset", "api", "knn"]
categories = ["data-structures", "encoding"]

# The API core (docs/design/srd-crate-boundaries.md §4): contracts and
# the vocabulary they name, and no implementation. Nothing here opens a
# connection, maps a file, decodes a vector file or resolves a dataset;
# reading and writing a descriptor's own YAML is its vocabulary. A
# dependency belongs here only when that vocabulary needs it.
[dependencies]
# The element model: element types, extensions, conversions, distances.
veks-datatypes = { path = "../veks-datatypes", version = "=4.0.2" }
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2.0.18"
url = "2.5"

[dev-dependencies]
tempfile = "3"
# The doc examples on the dataset contracts run against the
# implementation. Path-only, so publishing strips it.
vectordata = { path = "../vectordata" }

[lints]
workspace = true
