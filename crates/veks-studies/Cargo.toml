[package]
name = "veks-studies"
version = "1.8.0"
edition = "2024"
description = "Executable models of the SPLAT family — virtualized stores, traced operations, and measured cost against the published formulas"
license = "Apache-2.0"
# Never goes to crates.io. This is as-needed internal analysis —
# executable models and a storage simulator used to reason about the
# algorithms, not a library anyone depends on. It is already absent from
# the workspace's `default-members` and its tests sit behind a feature;
# this is the leg that matters most, because without it a release
# uploads it.
publish = false
homepage = "https://github.com/nosqlbench/vectordata-rs"
repository = "https://github.com/nosqlbench/vectordata-rs"

[lib]
name = "veks_studies"
path = "src/lib.rs"

[[bin]]
name = "veks-study"
path = "src/main.rs"

[features]
# The simulation suite, off by default.
#
# This crate is as-needed analysis, not something the product ships, and
# its tests run discrete-event simulations for around 200 s. Gating them
# keeps that cost out of `cargo test --workspace`, which overrides the
# workspace `default-members` list and would otherwise pull them in
# whatever that list says.
#
#   cargo test -p veks-studies --release --features heavy-tests
heavy-tests = []

[dependencies]
rand = "0.9"
rand_xoshiro = "0.7"

[lints]
workspace = true
